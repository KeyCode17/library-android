<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stacks — Reset Password (Android design)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
</head><body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span>● ▆ ▣</span></div>
  <header class="appbar back">
    <a class="backbtn">‹ Back</a>
    <span class="title">Set a new password</span>
  </header>
  <p class="sub" style="padding:0 24px 8px">Paste the code from your reset email and choose a new password.</p>
  <form class="form">
    <div class="field">
      <label for="code">Reset code</label>
      <input class="input" id="code" placeholder="Paste your reset code">
    </div>
    <div class="field">
      <label for="password">New password</label>
      <input class="input" id="password" type="password" placeholder="Choose a new password">
    </div>
    <button class="btn primary block" type="button">Reset password</button>
  </form>
</div>
</body></html>
