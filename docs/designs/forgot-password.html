<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stacks — Forgot Password (Android design)</title>
<!-- DESIGN SPEC: Forgot-password screen. Two phone frames — (1) request form, (2) sent confirmation (neutral, no account-existence leak). Maps to ForgotPasswordScreen.kt / ForgotPasswordContent. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
</head><body>

<!-- (1) Request form -->
<div class="phone">
  <div class="statusbar"><span>9:41</span><span>● ▆ ▣</span></div>
  <header class="appbar back">
    <a class="backbtn">‹ Back</a>
    <span class="title">Reset password</span>
  </header>
  <p class="sub" style="padding:0 24px 8px">Enter your email and we'll send a password-reset link.</p>
  <form class="form" onsubmit="return false">
    <label class="field">
      <span>Email</span>
      <input class="input" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com">
    </label>
    <button class="btn primary block" type="submit">Send reset link</button>
  </form>
</div>

<!-- (2) Sent confirmation -->
<div class="phone">
  <div class="statusbar"><span>9:41</span><span>● ▆ ▣</span></div>
  <header class="appbar back">
    <a class="backbtn">‹ Back</a>
    <span class="title">Reset password</span>
  </header>
  <p class="sub" style="padding:0 24px 8px">If an account exists for that email, we've sent a reset link. Open it on this device, or enter the code from the email.</p>
  <div class="form">
    <button class="btn primary block">Enter reset code</button>
  </div>
</div>

</body></html>
