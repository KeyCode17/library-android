<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stacks — Library WiFi (Android design)</title>
<!-- DESIGN SPEC: library WiFi provisioning screen (reached from Profile).
     Maps to Compose: WifiContent(state, networkName, onProvision, onBack).
     States: Idle / Provisioning / Success / Unsupported / Error.
     API < 29 (Android 10) falls back gracefully via Suggested network. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
</head><body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span>● ▆ ▣</span></div>
  <header class="appbar back">
    <a class="backbtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a>
    <span class="title">Library WiFi</span>
  </header>

  <div class="scroll">
    <div class="list" style="flex:none">
      <article class="card" style="text-align:center;padding:24px 18px">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="var(--pine)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="margin:0 auto 12px;display:block">
          <path d="M2 8.5a16 16 0 0120 0"/>
          <path d="M5 12a11 11 0 0114 0"/>
          <path d="M8.5 15.5a6 6 0 017 0"/>
          <circle cx="12" cy="19" r="1.1" fill="var(--pine)" stroke="none"/>
        </svg>
        <div class="h2">Stacks-Library</div>
        <div class="sub" style="margin-top:4px">Tap to join the library network</div>
        <button class="btn primary block" style="margin-top:16px">Connect</button>
      </article>

      <p class="helper">On Android 9 and older (API &lt; 29) the app falls back gracefully — the network is offered as a saved <em>Suggested</em> entry instead of being added directly.</p>

      <div class="rowflex">
        <span class="sectit">Status</span>
        <span class="badge ok">Suggested</span>
      </div>
    </div>
  </div>
</div>
</body></html>
