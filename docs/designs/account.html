<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stacks — Account (Android design)</title>
<!-- DESIGN SPEC: mobile account self-service. Back app bar + .form column of three .sectit-led sections. Map to Compose: AccountScreen.kt. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
</head><body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span>● ▆ ▣</span></div>
  <header class="appbar back">
    <a class="backbtn">‹ Back</a>
    <span class="title">Account</span>
  </header>
  <main class="form scroll">
    <section class="field">
      <div class="sectit">Email</div>
      <div class="field">
        <label for="email">Email</label>
        <input class="input" id="email" type="email" value="dana@stacks.app">
      </div>
      <button class="btn primary block">Update email</button>
    </section>

    <section class="field">
      <div class="sectit">Password</div>
      <div class="field">
        <label for="current">Current password</label>
        <input class="input" id="current" type="password" placeholder="Current password">
      </div>
      <div class="field">
        <label for="new">New password</label>
        <input class="input" id="new" type="password" placeholder="New password">
      </div>
      <button class="btn primary block">Change password</button>
    </section>

    <section class="field">
      <div class="sectit">Danger zone</div>
      <div class="error">This permanently deletes your account and cannot be undone.</div>
      <button class="btn danger block">Delete account</button>
    </section>
  </main>
</div></body></html>
