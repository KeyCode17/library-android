<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stacks — Register (Android design)</title>
<!-- DESIGN SPEC: mobile register / self sign-up. Maps to RegisterScreen.kt → RegisterContent.
     Fields: email, password (min 8). Primary action: Create account. Back link → Log in. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
</head><body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span>● ▆ ▣</span></div>

  <header class="appbar back">
    <a class="backbtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <span class="title">Create account</span>
  </header>

  <div style="padding:0 24px 4px">
    <p class="sub">Sign yourself up to browse the catalog and borrow books. Just an email and a password — at least 8 characters.</p>
  </div>

  <form class="form" onsubmit="return false">
    <div class="field">
      <label for="email">Email</label>
      <input class="input" id="email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com">
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input class="input" id="password" type="password" autocomplete="new-password" placeholder="At least 8 characters">
      <span class="helper">Use 8 or more characters.</span>
    </div>

    <button class="btn primary block" type="submit">Create account</button>
  </form>

  <div style="padding:18px 24px 0;text-align:center">
    <span class="sub">Already have an account? </span><a class="link">Log in</a>
  </div>
</div>
</body></html>
