# gradle/libs.versions.toml — version catalog (pinned per ADR-0001)
# AGP 9.x has BUILT-IN Kotlin: do NOT declare/apply org.jetbrains.kotlin.android.
# The `kotlin` version below is still used by the Compose compiler plugin and KSP,
# and must match the KGP that AGP 9.1 bundles (2.2.10).
[versions]
agp = "9.1.1"            # stable, mature (Quail 1 supports AGP 7.1–9.2; avoid 9.2 bleeding edge)
kotlin = "2.2.10"        # KGP bundled by AGP 9.1 — used by compose-compiler + ksp
coreKtx = "1.13.1"       # verify latest stable
lifecycle = "2.8.0"      # verify latest stable
activityCompose = "1.9.0"
composeBom = "2026.05.00" # verify latest stable Compose BOM
navigationCompose = "2.8.0"
hilt = "2.52"            # verify latest stable
hiltNavigationCompose = "1.2.0"
room = "2.7.0"           # verify latest stable
ksp = "2.2.10-1.0.0"     # must track the kotlin version
jna = "5.14.0"           # for the UniFFI recommender binding (later)

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# NOTE: no kotlin-android plugin — AGP 9 compiles Kotlin natively.
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
