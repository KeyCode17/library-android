# Robolectric runs against API 34 (installed + supported by Robolectric 4.16.1).
# This decouples the JVM test SDK from compileSdk 36, whose android-all jar Robolectric
# may not yet ship.
sdk=34

# Render Compose UI tests at the design's phone size (catalog.html is a 390x844 frame), so
# assertIsDisplayed reflects a real device viewport rather than Robolectric's small default.
qualifiers=w390dp-h844dp
