<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stacks — Login (Android design)</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="kit.css"><!-- DESIGN SPEC: auth login -> Compose LoginScreen --></head><body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span>● ▆ ▣</span></div>
  <header class="appbar back">
    <a class="backbtn" href="#"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a>
    <span class="title">Welcome back</span>
  </header>
  <form class="form" onsubmit="return false">
    <p class="sub">Sign in to your library account</p>
    <label class="field">
      <span>Email</span>
      <input class="input" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com">
    </label>
    <label class="field">
      <span>Password</span>
      <input class="input" type="password" autocomplete="current-password" placeholder="••••••••">
    </label>
    <button type="submit" class="btn primary block">Log in</button>
    <a class="link" href="#">New here? Create an account</a>
    <a class="link" href="#">Forgot password?</a>
  </form>
</div>
</body></html>
