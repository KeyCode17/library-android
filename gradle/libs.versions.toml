# gradle/libs.versions.toml — version catalog (pinned per ADR-0001)
# AGP 9.x has BUILT-IN Kotlin: do NOT declare/apply org.jetbrains.kotlin.android.
# The `kotlin` version below is still used by the Compose compiler plugin and KSP,
# and must match the KGP that AGP 9.1 bundles (2.2.10).
[versions]
agp = "9.1.1"            # 9.1.x per ADR-0001. NOTE: all AGP 9.1.x require Gradle >=9.3.1
                         # (ADR-0001's "Gradle 9.1" pin is impossible with AGP 9.1.x — see
                         # gradle-wrapper.properties; Gradle bumped to the AGP-mandated min).
kotlin = "2.2.10"        # KGP bundled by AGP 9.1 — used by compose-compiler + ksp
coreKtx = "1.13.1"
lifecycle = "2.8.0"
activityCompose = "1.9.0"
composeBom = "2026.05.00"
navigationCompose = "2.8.0"
hilt = "2.59.2"          # 2.52 (template) predates AGP 9 support; 2.57+ supports AGP 9
hiltNavigationCompose = "1.2.0"
room = "2.7.0"
ksp = "2.2.10-2.0.2"     # must track the kotlin version (2.2.10-1.0.0 does not exist)
jna = "5.17.0"           # UniFFI recommender binding; 5.15.0+ ships 16 KB-page-aligned .so
# --- networking / serialization / async (T-001) ---
retrofit = "2.11.0"
okhttp = "4.12.0"
kotlinxSerialization = "1.7.3"
kotlinxCoroutines = "1.9.0"
securityCrypto = "1.1.0"  # EncryptedSharedPreferences for the JWT (T-003)
mlkitCodeScanner = "16.1.0"  # ML Kit barcode (Google code scanner) for borrow-by-scan (T-004)
firebaseBom = "34.14.1"      # FCM (firebase-messaging) for push notifications (T-007)
zxing = "3.5.4"              # QR encoding for the access card (T-008)
# --- quality + test stack (M0) ---
detekt = "1.23.8"        # arturbosch stable; dev.detekt 2.0 is alpha — avoid
composeRules = "0.6.1"   # io.nlopez.compose.rules detekt ruleset
junit = "4.13.2"
robolectric = "4.16.1"   # runs JVM Compose UI tests for the pre-push gate (no emulator)
androidxTestExtJunit = "1.2.1"
espresso = "3.6.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }
# --- networking / serialization / async ---
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
mlkit-code-scanner = { group = "com.google.android.gms", name = "play-services-code-scanner", version.ref = "mlkitCodeScanner" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "kotlinxCoroutines" }
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
# --- test ---
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
# --- detekt compose ruleset ---
detekt-compose-rules = { group = "io.nlopez.compose.rules", name = "detekt", version.ref = "composeRules" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# NOTE: no kotlin-android plugin — AGP 9 compiles Kotlin natively.
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
