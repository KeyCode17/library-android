# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=false

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 built-in Kotlin migration bridge: KSP for Kotlin 2.2.10 still registers its
# generated sources via the old kotlin.sourceSets DSL. This documented flag re-allows that
# so Hilt/Room KSP output is compiled. Remove once KSP integrates via android.sourceSets.
# https://developer.android.com/r/tools/built-in-kotlin
android.disallowKotlinSourceSets=false

# Kotlin
kotlin.code.style=official
