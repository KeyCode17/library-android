<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stacks — Access Card (Android design)</title>
<!-- DESIGN SPEC: QR access card. Maps to AccessCardScreen.kt / AccessCardUiState.Ready.
     The QR encodes a MEMBERSHIP REFERENCE (the /auth/me principal id), never a JWT/secret. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
</head><body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span>● ▆ ▣</span></div>
  <header class="appbar back">
    <a class="backbtn">‹ Back</a>
    <span class="title">Access card</span>
  </header>
  <main class="empty">
    <div class="card" style="display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px;width:100%;max-width:300px">
      <div class="sectit" style="padding:0">Library access card</div>
      <div class="h2">Dana Keller</div>
      <span class="badge role">Member</span>
      <div class="qr"></div>
      <div class="mono sub">ID 7f3c…a91</div>
    </div>
    <div class="sub helper" style="max-width:260px">Show this at the library desk to check out.</div>
  </main>
</div></body></html>
